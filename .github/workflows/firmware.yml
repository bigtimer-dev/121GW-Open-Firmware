# Firmware: build the fast (production) variant with GNU binutils 2.46.0 (arm-none-eabi, built from the release tarball and cached, see
# .github/actions/arm-binutils), run the checks that need no original image, and on a tag v* publish firmware-<tag>.zip.  The like-v2.05 build has its own
# branch (like-v2.05) and releases (like205-vA.B.C).
name: Firmware

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and check the fast variant
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No Intel macOS build or package (owner decision)
        run: python3 -I .github/scripts/check_no_intel_mac.py
      - name: Production build (make) with `make check-ci`
        uses: ./.github/actions/build-firmware
        with:
          target: check-ci
      - name: FIXES.md from firmware/ORIGINAL_FIRMWARE_ISSUES.md
        run: python3 -I firmware/tools/gen_fixes.py firmware/ORIGINAL_FIRMWARE_ISSUES.md dist/FIXES.md
      - name: Nothing from an original image or calibration may be published
        run: python3 -I .github/scripts/check_no_originals.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-dist
          path: dist
          if-no-files-found: error

  release:
    name: Publish firmware-${{ github.ref_name }}.zip
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version the firmware shows
        run: python3 -I .github/scripts/check_fw_version.py "$TAG"
      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: dist
      - name: Assemble firmware-<tag>.zip
        run: |
          set -euo pipefail
          mkdir stage
          cp -R dist/2_fast stage/
          cp dist/FIXES.md LICENSE firmware/USER_GUIDE.md stage/
          (cd stage && sha256sum 2_fast/EEVBlog.bin USER_GUIDE.md FIXES.md LICENSE > SHA256SUMS)
          (cd stage && zip -r -X "../firmware-$TAG.zip" 2_fast USER_GUIDE.md FIXES.md LICENSE SHA256SUMS)
          unzip -l "firmware-$TAG.zip"
          python3 -I .github/scripts/check_no_originals.py "firmware-$TAG.zip"
          python3 -I .github/scripts/sha256sum.py "firmware-$TAG.zip" > "firmware-$TAG.zip.sha256"
      - name: Create the release if it does not exist and attach the files
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # the emulator workflow may create the release at the same moment: then the view below succeeds
            gh release create "$TAG" --verify-tag --title "121GW-Open-Firmware $TAG" --notes-file .github/release-notes.md \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "firmware-$TAG.zip" "firmware-$TAG.zip.sha256" --clobber
      - name: Attach the user manual and the newest 121GW Companion
        run: |
          set -euo pipefail
          # every firmware release carries the manual and the companion, so all downloads are on one page
          cp firmware/docs/manual/manual.pdf "121GW-User-Manual-$TAG.pdf"
          python3 -I .github/scripts/sha256sum.py "121GW-User-Manual-$TAG.pdf" > "121GW-User-Manual-$TAG.pdf.sha256"
          gh release upload "$TAG" "121GW-User-Manual-$TAG.pdf" "121GW-User-Manual-$TAG.pdf.sha256" --clobber
          comp=$(gh release list --limit 100 --json tagName,publishedAt \
                 -q '[.[] | select(.tagName | startswith("companion-v"))] | sort_by(.publishedAt) | last | .tagName')
          test -n "$comp"
          mkdir companion
          gh release download "$comp" --dir companion --pattern '121GW-Companion-*'
          ls companion
          gh release upload "$TAG" companion/* --clobber
