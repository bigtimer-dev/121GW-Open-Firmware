# Emulator: PyInstaller one-folder application with the v2.05 table data and the SYNTHETIC EEPROM image (no firmware: the
# emulator fetches the builds on demand from the releases, emu/fetch.py), packaged as macOS .dmg (Apple Silicon, arm64), Windows installer .exe (Inno Setup) and Linux AppImage (x86_64); on a
# tag v* the packages are attached to the release that firmware.yml creates.  Every package is started once (the UI must
# answer and the firmware must boot to a reading, emulator/tools/smoke.py) before it is published; the smoke tests start it with the
# fast image built here (--app), so they do not depend on GitHub's API.
#
# NOTE: the macOS packaging is the part that was run on a machine before this workflow was written (macOS arm64 build,
# .dmg, start from the mounted image).  The Windows and Linux jobs and this file as a whole have
# not run on GitHub yet.
name: Emulator

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['emulator/**', 'firmware/**', '.github/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # tag v1.2.3 -> v1.2.3; any other ref -> dev
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  firmware:
    name: Firmware builds for the emulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No Intel macOS build or package (owner decision)
        run: python3 -I .github/scripts/check_no_intel_mac.py
      - name: The tag matches the version the firmware shows
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: python3 -I .github/scripts/check_fw_version.py "$RELEASE_TAG"
      - name: Production build for the v2.05 table data and the smoke tests (image only; firmware.yml runs the checks)
        uses: ./.github/actions/build-firmware
        with:
          target: none
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-dist
          path: dist
          if-no-files-found: error

  tests:
    # Emulator tests of the production image that need no original EEVblog image (direct boot, synthetic EEPROM, the
    # table data of the build): one job per script, in parallel.  Not on release tags and no release job needs it, so a
    # slow runner cannot hold up a release; a failure fails the push / pull request run.
    name: Emulator test ${{ matrix.script }}
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EMU_TEST_WALL_S: '2280'                # the tests' own wall-clock guard (default 1800 s), below the job timeout
    strategy:
      fail-fast: false
      matrix:
        script: [test_sd_scr.py, test_sd_errors.py, test_dcv_fast.py, test_bft_files.py, test_bft_fast.py, test_bft_settings.py,
                 test_calbin_ident.py, test_sd_capacity.py, test_sd_slow.py, test_sd_clock.py,
                 test_setup_goto.py]
    steps:
      - uses: actions/checkout@v7
      - name: Production build (firmware/build/EEVBlog.bin and 121gw.map, the symbols the tests read; dist/v205_tables.json)
        uses: ./.github/actions/build-firmware
        with:
          target: none
      - name: Emulator data (v2.05 table data of the build, synthetic EEPROM)
        run: python -I emulator/tools/prepare_data.py --dist dist
      - name: Run ${{ matrix.script }}
        run: python -I emulator/scripts/${{ matrix.script }}      # default image firmware/build/EEVBlog.bin and its map

  macos:
    name: macOS ${{ matrix.arch }}
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: dist
      - name: Install build tools
        run: python -m pip install unicorn==2.1.4 capstone==5.0.9 pyinstaller==6.22.3 pillow pywebview==6.1
      - name: Prepare the emulator data (v2.05 tables, synthetic EEPROM) and icons
        run: |
          python -I emulator/tools/prepare_data.py --dist dist
          python -I emulator/packaging/make_icons.py build/icons
      - name: Application bundle
        working-directory: emulator
        run: |
          python -I ../.github/scripts/check_no_originals.py data
          EMU_VERSION="$RELEASE_TAG" EMU_ICON="$PWD/../build/icons/121gw-emulator.icns" \
            pyinstaller --noconfirm packaging/121gw_emulator.spec
          python -I ../.github/scripts/check_no_originals.py dist
      - name: Disk image
        working-directory: emulator
        run: sh packaging/make_dmg.sh "dist/121GW Emulator.app" "../121GW-Open-Firmware-Emulator-$RELEASE_TAG-macos-${{ matrix.arch }}.dmg"
      - name: Start the application from the mounted image
        run: |
          set -euo pipefail
          dmg="121GW-Open-Firmware-Emulator-$RELEASE_TAG-macos-${{ matrix.arch }}.dmg"
          mkdir mnt
          hdiutil attach -nobrowse -readonly -mountpoint mnt "$dmg"
          mnt/121GW\ Emulator.app/Contents/MacOS/121gw-emulator --no-open --port 8131 --app "$PWD/dist/2_fast/EEVBlog.bin" > app.log 2>&1 &
          python -I emulator/tools/smoke.py --url http://127.0.0.1:8131 --expect-direct --expect-synthetic \
            --load dist/2_fast/EEVBlog.bin || { cat app.log; exit 1; }
          curl -fsS -X POST -H 'X-121GW: quit' http://127.0.0.1:8131/quit
          sleep 2
          # as double-clicked: the front panel in the application's own window
          mnt/121GW\ Emulator.app/Contents/MacOS/121gw-emulator --port 8132 --app "$PWD/dist/2_fast/EEVBlog.bin" > win.log 2>&1 &
          for i in $(seq 120); do grep -q 'own window shown' win.log && break; sleep 1; done
          cat win.log
          grep -q 'own window shown' win.log
          curl -fsS -X POST -H 'X-121GW: quit' http://127.0.0.1:8132/quit
          sleep 2
          hdiutil detach mnt
      - name: Checksum
        run: python -I .github/scripts/sha256sum.py "121GW-Open-Firmware-Emulator-$RELEASE_TAG-macos-${{ matrix.arch }}.dmg" > "121GW-Open-Firmware-Emulator-$RELEASE_TAG-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-macos-${{ matrix.arch }}
          path: 121GW-Open-Firmware-Emulator-*
          if-no-files-found: error
      - name: Attach to the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "121GW-Open-Firmware $RELEASE_TAG" --notes-file .github/release-notes.md \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          python3 -I .github/scripts/check_no_intel_mac.py --dist 121GW-Open-Firmware-Emulator-*
          gh release upload "$RELEASE_TAG" 121GW-Open-Firmware-Emulator-* --clobber

  windows:
    name: Windows x64
    needs: firmware
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MSYS_NO_PATHCONV: '1'            # Git Bash must not rewrite arguments such as /VERYSILENT or /DAppVersion=...
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: dist
      - name: Install build tools
        run: python -m pip install unicorn==2.1.4 capstone==5.0.9 pillow
      - name: Prepare the emulator data and icons
        run: |
          python -I emulator/tools/prepare_data.py --dist dist
          python -I emulator/packaging/make_icons.py build/icons
      - name: Application folder (embeddable Python)
        # Windows ships the official embeddable CPython with the emulator sources: the emulator is proven to run under
        # python.exe, while a PyInstaller build of it ended with 0xC0000409 (fail-fast) as soon as emulation started.
        run: |
          set -euo pipefail
          python -I .github/scripts/check_no_originals.py emulator/data
          out=emulator/dist/121gw-emulator; rm -rf "$out"; mkdir -p "$out/app"
          curl -fsSL -o pyembed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          python -I .github/scripts/sha256sum.py pyembed.zip
          powershell -NoProfile -Command "Expand-Archive -Path pyembed.zip -DestinationPath '$out/python'"
          # module search path of the embedded interpreter: its stdlib, its site-packages and the emulator sources
          printf 'python311.zip\r\n.\r\nLib\\site-packages\r\n..\\app\r\nimport site\r\n' > "$out/python/python311._pth"
          python -m pip install --no-compile --target "$out/python/Lib/site-packages" unicorn==2.1.4 capstone==5.0.9 pywebview==6.1
          cp -r emulator/app.py emulator/launcher.py emulator/emu emulator/ui emulator/data "$out/app/"
          cp build/icons/121gw-emulator.ico "$out/app/"
          cp LICENSE "$out/"
          find "$out" -name __pycache__ -prune -exec rm -rf {} +
          python -I .github/scripts/check_no_originals.py "$out"
          "$out/python/python.exe" -c "import unicorn, capstone, webview, app; print('embedded interpreter ok')"
      - name: Installer (Inno Setup)
        run: |
          set -euo pipefail
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$iscc" ]; then choco install innosetup -y --no-progress; fi
          "$iscc" "/DAppVersion=$RELEASE_TAG" "/DSourceDir=$(cygpath -w "$PWD/emulator/dist/121gw-emulator")" \
            "/DOutputDir=$(cygpath -w "$PWD")" "/DLicenseFile=$(cygpath -w "$PWD/LICENSE")" \
            "$(cygpath -w "$PWD/emulator/packaging/windows/121gw_emulator.iss")"
          ls -l 121GW-Open-Firmware-Emulator-*
      - name: Install silently and start the installed application
        shell: pwsh
        run: |
          $setup = "121GW-Open-Firmware-Emulator-$env:RELEASE_TAG-windows-x64.exe"
          $dir = Join-Path $PWD "installed"
          Start-Process -FilePath ".\$setup" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait
          $p = Start-Process -FilePath (Join-Path $dir "python\python.exe") -ArgumentList "`"$(Join-Path $dir 'app\launcher.py')`"", "--no-open", "--port", "8131", "--app", "`"$(Join-Path $PWD 'dist\2_fast\EEVBlog.bin')`"" `
                 -RedirectStandardOutput app.log -RedirectStandardError app.err -PassThru -NoNewWindow
          python -I emulator/tools/smoke.py --url http://127.0.0.1:8131 --timeout 300 --expect-direct --expect-synthetic --load dist/2_fast/EEVBlog.bin
          $ok = $LASTEXITCODE -eq 0
          if (-not $ok) {
            "has exited: $($p.HasExited)  exit code: $($p.ExitCode)  exit time: $($p.ExitTime)"
            Get-Content app.log; Get-Content app.err
            exit 1
          }
          Invoke-WebRequest -Method Post -Headers @{ "X-121GW" = "quit" } -Uri http://127.0.0.1:8131/quit | Out-Null
          Start-Sleep 2
          # as started from the Start menu (pythonw.exe has no output: python.exe with the same arguments shows the log):
          # the front panel in the application's own window (WebView2)
          $w = Start-Process -FilePath (Join-Path $dir "python\python.exe") -ArgumentList "`"$(Join-Path $dir 'app\launcher.py')`"", "--port", "8132" `
                 -RedirectStandardOutput win.log -RedirectStandardError win.err -PassThru
          $shown = $false
          for ($i = 0; $i -lt 180 -and -not $shown; $i++) { Start-Sleep 1; $shown = Select-String -Path win.log -Pattern 'own window shown' -Quiet }
          Get-Content win.log; Get-Content win.err
          if (-not $shown) { exit 1 }
          Invoke-WebRequest -Method Post -Headers @{ "X-121GW" = "quit" } -Uri http://127.0.0.1:8132/quit | Out-Null
          Start-Sleep 2
      - name: Checksum
        run: python -I .github/scripts/sha256sum.py "121GW-Open-Firmware-Emulator-$RELEASE_TAG-windows-x64.exe" > "121GW-Open-Firmware-Emulator-$RELEASE_TAG-windows-x64.exe.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-windows-x64
          path: 121GW-Open-Firmware-Emulator-*
          if-no-files-found: error
      - name: Attach to the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "121GW-Open-Firmware $RELEASE_TAG" --notes-file .github/release-notes.md \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" 121GW-Open-Firmware-Emulator-* --clobber

  linux:
    name: Linux x86_64 AppImage
    needs: firmware
    # the oldest Ubuntu runner image: the bundled interpreter links the system C library, so an older one runs on more systems
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPIMAGE_EXTRACT_AND_RUN: '1'     # the runner has no FUSE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: dist
      - name: Install build tools
        run: python -m pip install unicorn==2.1.4 capstone==5.0.9 pyinstaller==6.22.3 pillow
      - name: Prepare the emulator data and icons
        run: |
          python -I emulator/tools/prepare_data.py --dist dist
          python -I emulator/packaging/make_icons.py build/icons
      - name: The emulator runs from the source tree with the bundled data (direct boot, synthetic EEPROM)
        run: |
          set -euo pipefail
          (cd emulator && python -I app.py --no-inputs --port 8130 --app ../dist/2_fast/EEVBlog.bin > ../app-src.log 2>&1 &)
          python -I emulator/tools/smoke.py --url http://127.0.0.1:8130 --expect-direct --expect-synthetic || { cat app-src.log; exit 1; }
          curl -fsS -X POST -H 'X-121GW: quit' http://127.0.0.1:8130/quit
          sleep 2
      - name: Application folder
        working-directory: emulator
        run: |
          python -I ../.github/scripts/check_no_originals.py data
          EMU_VERSION="$RELEASE_TAG" pyinstaller --noconfirm packaging/121gw_emulator.spec
          python -I ../.github/scripts/check_no_originals.py dist
      - name: AppImage
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
          sh emulator/packaging/linux/build_appimage.sh emulator/dist/121gw-emulator \
            "121GW-Open-Firmware-Emulator-$RELEASE_TAG-linux-x86_64.AppImage" build/icons/121gw-emulator.png "$PWD/appimagetool.AppImage"
      - name: Start the AppImage
        run: |
          set -euo pipefail
          ./"121GW-Open-Firmware-Emulator-$RELEASE_TAG-linux-x86_64.AppImage" --no-open --port 8131 --app "$PWD/dist/2_fast/EEVBlog.bin" > app.log 2>&1 &
          python -I emulator/tools/smoke.py --url http://127.0.0.1:8131 --expect-direct --expect-synthetic \
            --load dist/2_fast/EEVBlog.bin || { cat app.log; exit 1; }
          curl -fsS -X POST -H 'X-121GW: quit' http://127.0.0.1:8131/quit
          sleep 2
      - name: Debian package, installed and started
        run: |
          set -euo pipefail
          deb="121GW-Open-Firmware-Emulator-$RELEASE_TAG-linux-amd64.deb"
          sh emulator/packaging/linux/build_deb.sh emulator/dist/121gw-emulator "$RELEASE_TAG" "$deb" build/icons/121gw-emulator.png
          sudo apt-get install -y "./$deb"
          121gw-emulator --no-open --port 8133 --app "$PWD/dist/2_fast/EEVBlog.bin" > deb.log 2>&1 &
          python -I emulator/tools/smoke.py --url http://127.0.0.1:8133 --expect-direct --expect-synthetic || { cat deb.log; exit 1; }
          curl -fsS -X POST -H 'X-121GW: quit' http://127.0.0.1:8133/quit
          sleep 2
          sudo apt-get remove -y 121gw-emulator
      - name: Checksum
        run: |
          python -I .github/scripts/sha256sum.py "121GW-Open-Firmware-Emulator-$RELEASE_TAG-linux-x86_64.AppImage" > "121GW-Open-Firmware-Emulator-$RELEASE_TAG-linux-x86_64.AppImage.sha256"
          python -I .github/scripts/sha256sum.py "121GW-Open-Firmware-Emulator-$RELEASE_TAG-linux-amd64.deb" > "121GW-Open-Firmware-Emulator-$RELEASE_TAG-linux-amd64.deb.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-linux-x86_64
          path: 121GW-Open-Firmware-Emulator-*
          if-no-files-found: error
      - name: Attach to the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "121GW-Open-Firmware $RELEASE_TAG" --notes-file .github/release-notes.md \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" 121GW-Open-Firmware-Emulator-* --clobber
